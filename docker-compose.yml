services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      WEB_DIR: "/app/web"
      # Reserved for Phase 4 (Mongo wiring). Unused in Phase 0.
      MONGO_URI: "mongodb://mongodb:27017/ddoslab"
      # Phase 2: base URL workers hit (compose service name; local dev
      # defaults to http://localhost:8081 when unset).
      TARGET_BASE_URL: "http://test-server:8081"
    volumes:
      # Live-edit static UI without rebuilding during dev.
      - ./web:/app/web:ro
    depends_on:
      mongodb:
        condition: service_healthy
      test-server:
        condition: service_started

  test-server:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["./test-server"]
    ports:
      - "8081:8081"
    environment:
      TEST_SERVER_PORT: "8081"
      SLOW_DELAY_MS: "200"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/api/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo-data:
