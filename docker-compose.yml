services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      WEB_DIR: "/app/web"
      # Reserved for Phase 4 (Mongo wiring). Unused in Phase 0.
      MONGO_URI: "mongodb://mongodb:27017/ddoslab"
    volumes:
      # Live-edit static UI without rebuilding during dev.
      - ./web:/app/web:ro
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo-data:
